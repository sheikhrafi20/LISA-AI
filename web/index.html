<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LISA · AI অফিস</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#04050d;--p:rgba(16,20,44,.74);--ln:rgba(124,140,255,.3);--tx:#eaedff;--mu:#9aa3d6;--a:#7c5cff;--b:#22d3ee;--c:#ff5fa8}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg) radial-gradient(900px 500px at 15% -10%,#2a1a6e66,transparent) no-repeat;color:var(--tx);font:15px/1.55 system-ui,'Noto Sans Bengali','Segoe UI',sans-serif}
.w{max-width:980px;margin:0 auto;padding:12px 12px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:800 clamp(18px,5vw,28px) Orbitron,system-ui,sans-serif;letter-spacing:.08em;margin:6px 0;background:linear-gradient(90deg,var(--c),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:12px;padding:4px 10px;border:1px solid var(--ln);border-radius:99px;background:var(--p);color:var(--mu)}.chip.ok{color:#6ee7b7;border-color:#10b98199}.chip.bad{color:#fca5a5;border-color:#ef444499}
.room{position:relative;aspect-ratio:16/11;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:#0a0f2c;box-shadow:0 0 40px #7c5cff33}
.wall{position:absolute;inset:0 0 54% 0;background:radial-gradient(circle,#22d3ee88 0 1.5px,transparent 2px) 0 0/22px 18px,repeating-linear-gradient(90deg,#0a0e2b 0 16px,#131c52 16px 24px,#0a0e2b 24px 46px) bottom/100% 55% no-repeat,linear-gradient(#1a1050,#2a1b7a 70%,#ff5fa866)}
.floor{position:absolute;inset:46% 0 0 0;background:repeating-linear-gradient(90deg,#ffffff0f 0 1px,transparent 1px 8%),repeating-linear-gradient(0deg,#ffffff0f 0 1px,transparent 1px 14%),linear-gradient(#0e1440,#060818)}
.tbl{position:absolute;left:50%;top:57%;width:42%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#3b2fa099,#0a0f2c 72%);border:2px solid #7c5cffaa;box-shadow:0 0 30px #7c5cff88,inset 0 0 30px #22d3ee55}
.ag{position:absolute;width:19%;min-width:58px;transform:translate(-50%,-50%);text-align:center;filter:saturate(.75) brightness(.8);transition:filter .3s,transform .3s}
.ag svg,.pic svg{width:100%;display:block;overflow:visible}.ag svg{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.nm{font:700 10px Orbitron,system-ui,sans-serif;letter-spacing:.06em;margin-top:-3px}.nm span{display:block;font:9px system-ui,sans-serif;color:var(--mu);letter-spacing:0}
.ag.on{filter:none;transform:translate(-50%,-50%) scale(1.12);z-index:3}.ag.on svg{filter:drop-shadow(0 0 9px var(--g))}
.eyes{transform-box:fill-box;transform-origin:center;animation:bl 5s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}.on .mouth{animation:tk .2s ease-in-out infinite alternate}
@keyframes tk{to{transform:scaleY(1.8)}}
.pp{position:absolute;left:50%;top:-14%;width:11%;min-width:36px;aspect-ratio:3/4;background:#f6f2e4;color:#1a1a2e;border-radius:3px;padding:3px;font:7px/1.25 system-ui,sans-serif;overflow:hidden;transform:translate(-50%,-50%) rotate(var(--r));box-shadow:0 4px 14px #0009;transition:left .9s,top .9s,width .5s,transform .5s;z-index:2}
.pp b{display:block;color:#6d4cff}
.pp.rd{left:50%!important;top:46%!important;width:44%;aspect-ratio:auto;max-height:72%;z-index:7;transform:translate(-50%,-50%) rotate(0);font-size:clamp(10px,2.7vw,15px);padding:8px 10px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#000c);z-index:4;pointer-events:none}
.lb{position:absolute;left:0;right:0;height:5%;background:#000;z-index:8}.lb.t{top:0}.lb.b{bottom:0}
.sub{position:absolute;left:4%;right:4%;bottom:7%;text-align:center;font-size:clamp(11px,2.9vw,15px);text-shadow:0 1px 6px #000;z-index:9;min-height:1.5em}.sub b{color:var(--b)}
.ph{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.ph span{flex:1;min-width:70px;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;border:1px solid var(--ln);background:var(--p);color:var(--mu)}
.ph .on{color:#fff;border-color:var(--a);background:#7c5cff33;box-shadow:0 0 14px #7c5cff66}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px}
textarea{width:100%;min-height:64px;resize:vertical;background:#070a1f;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
button{font:600 14px system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,var(--a),#4f46e5);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.g{background:#ffffff12;border:1px solid var(--ln)}button.sel{outline:2px solid var(--b)}
button.rec{background:linear-gradient(135deg,#ef4444,#be123c);animation:pu 1s infinite}@keyframes pu{50%{box-shadow:0 0 0 8px #ef444433}}
.hero{display:flex;gap:12px;align-items:flex-start}.pic{width:96px;flex:none}#txt{white-space:pre-wrap;margin-top:4px}
.wk{display:grid;gap:10px;margin-top:8px}.wk div{font-size:13px}.bar{height:6px;border-radius:9px;background:#ffffff14;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a));transition:width 1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>LISA · AI অফিস</h1><span class="chip" id="mode">Python LISA যাচাই হচ্ছে…</span></div>
<div class="room" id="room"><div class="wall"></div><div class="floor"></div><div class="tbl"></div><div class="vig"></div><div class="lb t"></div><div class="lb b"></div><div class="sub" id="sub">টিম প্রস্তুত। আপনার কাজ দিন।</div></div>
<div class="ph" id="ph"><span>১ · পেপার</span><span>২ · পড়া</span><span>৩ · কাজ</span><span>৪ · উত্তর</span></div>
<div class="card"><textarea id="t" placeholder="আপনার কাজ লিখুন, অথবা মাইক চেপে বলুন…"></textarea>
<div class="row"><button class="g" id="mic" hidden>🎤 বলুন</button><button id="go">▶ কাজ দিন</button><span class="chip">উত্তরদাতা</span><button class="g sel" id="vf">♀ মেয়ে</button><button class="g" id="vm">♂ ছেলে</button><button class="g" id="snd" title="ভয়েস: অটো / ব্রাউজার / পাইথন / বন্ধ">🔊 অটো</button></div>
<div class="chip" id="note" style="margin-top:8px" hidden></div></div>
<div class="card hero" id="ans" hidden><div class="pic" id="pic"></div><div><b id="who"></b><div id="txt"></div></div></div>
<div class="card" id="wkc" hidden><b>কাজ চলছে</b><div class="wk" id="wk"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const AG=[
{id:'LISA',r:'লিড',age:24,g:'f',k:'#ffe2d2',h:'#ff6fb0',h2:'#9b2c86',e:'#8b5cf6',e2:'#e9d5ff',s:'#4c35c9'},
{id:'NOVA',r:'গবেষক',age:26,g:'f',k:'#f6d3bb',h:'#38e0f5',h2:'#0b6f9a',e:'#06b6d4',e2:'#cffafe',s:'#0e7490'},
{id:'KAI',r:'ইঞ্জিনিয়ার',age:28,g:'m',k:'#f1cba9',h:'#4a5bb0',h2:'#171d4a',e:'#10b981',e2:'#d1fae5',s:'#047857'},
{id:'MIRA',r:'ডিজাইনার',age:23,g:'f',k:'#ffe2d2',h:'#ffb020',h2:'#c2410c',e:'#f43f5e',e2:'#ffe4e6',s:'#be123c'},
{id:'ORION',r:'রিভিউয়ার',age:32,g:'m',k:'#e3b895',h:'#dfe3ee',h2:'#59627a',e:'#f97316',e2:'#ffedd5',s:'#374151',gl:1}];
const B=Object.fromEntries(AG.map(a=>[a.id,a])),POS={LISA:[50,81],NOVA:[15,57],KAI:[85,57],MIRA:[31,28],ORION:[69,28]};
let N=0;
function av(a){const f=a.g==='f',n=++N,x=[37,63];
 const eye=x.map(c=>`<path d="M${c-7.5} 56Q${c} 46 ${c+7.5} 56Q${c} 67 ${c-7.5} 56Z" fill="#fff"/><ellipse cx="${c}" cy="57" rx="5.4" ry="${f?7.6:6.6}" fill="url(#i${n})"/><ellipse cx="${c}" cy="57.5" rx="2.2" ry="3.6" fill="#140a2a"/><circle cx="${c-2.2}" cy="54" r="2.1" fill="#fff"/><circle cx="${c+2}" cy="60.5" r="1" fill="#fff" opacity=".85"/><path d="M${c-8.5} 55.5Q${c} 44 ${c+8.5} 55.5" stroke="#1b1030" stroke-width="2.2" fill="none" stroke-linecap="round"/>`).join('');
 return `<svg viewBox="0 0 100 130" aria-hidden="true"><defs><linearGradient id="h${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a.h}"/><stop offset="1" stop-color="${a.h2}"/></linearGradient><radialGradient id="i${n}" cx=".5" cy=".75" r=".8"><stop offset="0" stop-color="${a.e2}"/><stop offset=".55" stop-color="${a.e}"/><stop offset="1" stop-color="#1e1b4b"/></radialGradient></defs>
${f?`<path d="M14 72C2 30 20 6 50 6C80 6 98 30 86 72L94 126H6Z" fill="url(#h${n})"/>`:''}
<path d="M6 130Q10 92 50 88Q90 92 94 130Z" fill="${a.s}"/><path d="M38 90L50 108L62 90" stroke="#ffffff88" stroke-width="2" fill="none"/><circle cx="50" cy="112" r="3" fill="${a.e}"/>
<path d="M43 66h14v26Q50 100 43 92Z" fill="${a.k}"/>
<path d="M25 50C25 30 38 24 50 24C62 24 75 30 75 50C75 66 66 80 50 87C34 80 25 66 25 50Z" fill="${a.k}"/>
<ellipse cx="31" cy="68" rx="5.5" ry="3" fill="#ff6b8f" opacity=".3"/><ellipse cx="69" cy="68" rx="5.5" ry="3" fill="#ff6b8f" opacity=".3"/>
<g class="eyes">${eye}</g>
<path d="M29 44Q37 39 45 43M55 43Q63 39 71 44" stroke="${a.h2}" stroke-width="${f?1.7:2.8}" fill="none" stroke-linecap="round"/>
<path d="M49 66Q50 68 51 66" stroke="#c98a74" stroke-width="1" fill="none"/><ellipse class="mouth" cx="50" cy="74" rx="4.6" ry="2.4" fill="#8b2347"/>
${a.gl?`<g stroke="#e5e7eb" stroke-width="1.4" fill="#a5f3fc22"><rect x="28" y="46" width="18" height="20" rx="6"/><rect x="54" y="46" width="18" height="20" rx="6"/><path d="M46 54h8"/></g>`:''}
<path d="${f?'M24 54C21 22 38 12 50 12C64 12 80 22 76 54C71 38 62 31 50 34C38 31 29 38 24 54Z':'M24 52C20 18 36 12 50 10C66 12 80 18 76 52L72 34L62 40L53 26L44 40L34 33Z'}" fill="url(#h${n})"/>
<path d="M33 22Q50 12 67 22" stroke="#fff" stroke-opacity=".5" stroke-width="2.6" fill="none" stroke-linecap="round"/>
${f?`<path d="M24 54Q16 80 26 104M76 54Q84 80 74 104" stroke="url(#h${n})" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M66 18l2 5 5 .5-4 3.5 1.2 5-4.2-2.8-4.2 2.8 1.2-5-4-3.5 5-.5z" fill="${a.e}"/>`:''}
<circle cx="22" cy="60" r="3.6" fill="${a.e}" stroke="#fff" stroke-opacity=".6"/><circle cx="78" cy="60" r="3.6" fill="${a.e}" stroke="#fff" stroke-opacity=".6"/></svg>`}
AG.forEach((a,i)=>{const [px,py]=POS[a.id],d=document.createElement('div');d.className='ag';d.id='ag-'+a.id;d.style.cssText=`left:${px}%;top:${py}%;--g:${a.h}`;
 d.innerHTML=av(a)+`<div class="nm">${a.id}<span>${a.r} · ${a.age}</span></div>`;$('#room').append(d);
 const p=document.createElement('div');p.className='pp';p.id='pp-'+a.id;p.style.setProperty('--r',(i*7-14)+'deg');p.innerHTML='<b>মিশন</b><span></span>';$('#room').append(p)});
const setSp=id=>AG.forEach(a=>$('#ag-'+a.id).classList.toggle('on',a.id===id));
function sub(who,t){const s=$('#sub');s.textContent='';if(who){const b=document.createElement('b');b.textContent=who+': ';s.append(b,t)}else s.textContent=t}
const phase=n=>[...$('#ph').children].forEach((c,i)=>c.classList.toggle('on',i<=n));
function note(t){const n=$('#note');n.textContent=t;n.hidden=!t}
let run=0,pres='f',vm=0;const VM=['🔊 অটো','🌐 ব্রাউজার','🐍 পাইথন','🔇 বন্ধ'];
fetch('/api/status').then(r=>r.json()).then(s=>{const m=$('#mode');m.className='chip ok';m.textContent=s.ai?`Python LISA ✓ · AI: ${s.provider} (${s.model})`:'Python LISA ✓ · AI বন্ধ (অফলাইন প্ল্যান)'}).catch(()=>{const m=$('#mode');m.className='chip bad';m.textContent='Python সার্ভার নেই';note('টার্মিনালে চালান: python -m src.web')});
/* voice: browser voices, or Python (system) voice as a guaranteed fallback */
const hasTTS='speechSynthesis' in window;let voices=[];
if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
function pick(g){const F=/female|zira|samantha|susan|hazel|aria|jenny|heera|nabanita|tanishaa|karen|moira|tessa|fiona/i,M=/\bmale\b|david|mark|daniel|alex|george|guy|pradeep|bashkar|ravi|james|fred/i;
 const bn=voices.filter(v=>/^bn/i.test(v.lang)),pool=bn.length?bn:voices.filter(v=>/^en/i.test(v.lang));return pool.find(v=>(g==='f'?F:M).test(v.name))||pool[0]||null}
function utter(text,g){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text),v=pick(g);if(v){u.voice=v;u.lang=v.lang}else u.lang='bn-BD';
 u.pitch=g==='f'?1.2:.8;let d=false;const f=()=>{if(!d){d=true;res()}};u.onend=f;u.onerror=f;setTimeout(f,Math.max(3000,text.length*140));speechSynthesis.speak(u)})}
async function sayB(text,g){for(const c of text.match(/[^।.!?\n]+[।.!?]?/g)||[text]){if(c.trim())await utter(c.trim(),g)}}
async function sayP(text){try{const r=await fetch('/api/speak',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})}),j=await r.json();if(!j.ok)note('পাইথন ভয়েস: '+j.error)}catch(e){note('Python সার্ভারে সংযোগ হয়নি।')}}
function say(text,g){if(vm===3)return Promise.resolve();const b=vm===1||(vm===0&&hasTTS&&voices.length>0);return b?sayB(text,g):sayP(text)}
/* push-to-talk */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const mic=$('#mic'),t=$('#t'),r=new SR();let base='';r.lang='bn-BD';r.interimResults=true;mic.hidden=false;
 r.onresult=e=>{let s='';for(const x of e.results)s+=x[0].transcript;t.value=base+s};
 r.onend=()=>{mic.classList.remove('rec');mic.textContent='🎤 বলুন'};r.onerror=e=>note('মাইক সমস্যা: '+e.error);
 mic.onclick=()=>{if(mic.classList.contains('rec')){r.stop();return}base=t.value?t.value.trimEnd()+' ':'';try{r.start();mic.classList.add('rec');mic.textContent='⏹ থামুন'}catch(e){}}}
async function type(el,text,my){for(let i=1;i<=text.length;i++){if(my!==run)return;el.textContent=text.slice(0,i);await wait(18)}}
/* the meeting: papers go out, then each one reads theirs aloud, one by one */
async function go(){const task=$('#t').value.trim();if(!task)return;const my=++run;
 if(hasTTS){speechSynthesis.cancel();speechSynthesis.resume()}
 AG.forEach(a=>{const p=$('#pp-'+a.id);p.classList.remove('rd');p.style.left='50%';p.style.top='-14%'});
 $('#ans').hidden=true;$('#wkc').hidden=true;note('');phase(0);setSp('LISA');sub('LISA','কাজটা বুঝে নিচ্ছি…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task})});if(!r.ok)throw 0;const p=await r.json();if(my!==run)return;
  const q=task.length>45?task.slice(0,45)+'…':task;
  for(const a of AG){const pp=$('#pp-'+a.id),[px,py]=POS[a.id];pp.querySelector('span').textContent=q;pp.style.left=px+'%';pp.style.top=Math.min(py+15,92)+'%';sub('LISA',a.id+'-এর কাছে পেপার পাঠানো হচ্ছে…');await wait(450)}
  phase(1);
  for(const l of p.talk){if(my!==run)return;const pp=$('#pp-'+l.a);pp.querySelector('span').textContent=l.t;pp.classList.add('rd');setSp(l.a);sub(l.a,l.t);await say(l.t,B[l.a].g);pp.classList.remove('rd');await wait(250)}
  phase(2);setSp(null);const wk=$('#wk'),ids=['NOVA','KAI','MIRA','ORION'].filter(i=>p.work[i]),bars={};wk.textContent='';$('#wkc').hidden=false;
  ids.forEach(i=>{const d=document.createElement('div'),b=document.createElement('div'),f=document.createElement('i');d.textContent=i+' — '+p.work[i];b.className='bar';b.append(f);d.append(b);wk.append(d);bars[i]=f});await wait(60);
  for(const i of ids){if(my!==run)return;setSp(i);sub(i,p.work[i]);bars[i].style.width='100%';await wait(1100)}
  phase(3);const pid=pres==='f'?'LISA':'KAI',a=B[pid];$('#pic').innerHTML=av(a);$('#who').textContent=a.id+' · চূড়ান্ত উত্তর'+(p.live?'':' (অফলাইন প্ল্যান)');
  $('#txt').textContent='';$('#ans').hidden=false;$('#ans').classList.add('on');setSp(pid);sub(pid,'আপনার উত্তর প্রস্তুত।');$('#ans').scrollIntoView({behavior:'smooth',block:'nearest'});
  await Promise.all([type($('#txt'),p.final,my),say(p.final,a.g)]);if(my!==run)return;
  $('#ans').classList.remove('on');setSp(null);sub(null,'কাজ শেষ। নতুন কাজ দিন।');
 }catch(e){if(my===run){setSp(null);sub(null,'সমস্যা হয়েছে। Python LISA চালু আছে কি? (python -m src.web)')}}}
$('#go').onclick=go;$('#t').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))go()});
const setV=g=>{pres=g;$('#vf').classList.toggle('sel',g==='f');$('#vm').classList.toggle('sel',g==='m')};$('#vf').onclick=()=>setV('f');$('#vm').onclick=()=>setV('m');
$('#snd').onclick=()=>{vm=(vm+1)%4;$('#snd').textContent=VM[vm];if(hasTTS)speechSynthesis.cancel()};
</script>
</body>
</html>
